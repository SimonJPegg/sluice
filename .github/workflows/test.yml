name: test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Lint
        run: ./gradlew detekt
      - name: Test
        run: ./gradlew test
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: build/test-results/test/*.xml
          reporter: java-junit
      - name: Helm lint
        run: helm lint charts/sluice
      - name: Helm template
        run: helm template sluice charts/sluice
      - name: Docker build
        run: docker build . --tag sluice:$(date +%s)
