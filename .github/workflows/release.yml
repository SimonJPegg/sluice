name: release
on:
  push:
    tags: [ '*.*.*' ]
env:
  CLOUDSMITH_REGISTRY: docker.cloudsmith.io
  CLOUDSMITH_OWNER: antipathy-org
  CLOUDSMITH_REPO: sluice
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into Cloudsmith Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CLOUDSMITH_REGISTRY }}
          username: ${{ secrets.CLOUDSMITH_USERNAME }}
          password: ${{ secrets.CLOUDSMITH_API_KEY }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CLOUDSMITH_REGISTRY }}/${{ env.CLOUDSMITH_OWNER }}/${{ env.CLOUDSMITH_REPO }}/sluice
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.CLOUDSMITH_REGISTRY }}/${{ env.CLOUDSMITH_OWNER }}/${{ env.CLOUDSMITH_REPO }}/sluice:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release
        uses: softprops/action-gh-release@v3
      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli
      - name: Package Helm chart
        run: helm package charts/sluice --version ${{ github.ref_name }} --app-version ${{ github.ref_name }}
      - name: Push Helm chart to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push helm ${{ env.CLOUDSMITH_OWNER }}/${{ env.CLOUDSMITH_REPO }} sluice-${{ github.ref_name }}.tgz
